[package]
name = "personal-agent"
version = "0.1.0"
description = "Local personal AI desktop agent"
authors = ["Flo"]
edition = "2024"

[lib]
name = "personal_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-opener = "2.7.2"
tauri-plugin-shell = "2.5.0"

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
