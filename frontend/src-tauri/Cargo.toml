[package]
name = "personal-agent"
version = "0.1.0"
description = "Local personal AI desktop agent"
authors = ["Flo"]
edition = "2024"

[lib]
name = "personal_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-clipboard-manager = "2.5.0"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2.7.2"
tauri-plugin-shell = "2.5.0"
tauri-plugin-single-instance = "2"
window-vibrancy = "0.6"
winreg = "0.55"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Foundation",
  "Foundation_Collections",
  "ApplicationModel",
  "UI_Notifications",
  "UI_Notifications_Management",
  "Win32_System_Com",
] }

# https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
